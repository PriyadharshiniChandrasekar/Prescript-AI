<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create Account | PrescriptAI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-badge">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 2v6M12 16v6M2 12h6M16 12h6"/></svg>
        </div>
        <div>
          <h1>PrescriptAI</h1>
          <span class="tag">REMINDER AGENT</span>
        </div>
      </div>

      <h2>Create your account</h2>
      <p class="sub">Start tracking prescriptions and never miss a dose.</p>

      <div class="form-error" id="errorBox"></div>

      <form id="registerForm" autocomplete="off">
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" required placeholder="Sekar Subish">
        </div>
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" required placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="At least 6 characters">
        </div>
        <button type="submit" class="btn-primary" id="registerBtn">Create Account</button>
      </form>

      <div class="auth-switch">
        Already have an account? <a href="login.html">Log in</a>
      </div>
    </div>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
