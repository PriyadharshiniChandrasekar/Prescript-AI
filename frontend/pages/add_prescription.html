<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add Prescription | PrescriptAI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="brand">
      <div class="logo-badge"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 2v6M12 16v6M2 12h6M16 12h6"/></svg></div>
      <div><h1>PrescriptAI</h1><span class="tag">REMINDER AGENT</span></div>
    </div>
    <a class="nav-item" data-page="dashboard" href="dashboard.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      Dashboard
    </a>
    <a class="nav-item active" data-page="add" href="add_prescription.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      Add Prescription
    </a>
    <a class="nav-item" data-page="ai" href="ai_assistant.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      AI Assistant
    </a>
    <a class="nav-item" data-page="history" href="history.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      Prescription History
    </a>
    <a class="nav-item" data-page="profile" href="profile.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      My Profile
    </a>
    <div class="spacer"></div>
    <div class="sidebar-user">
      <div class="avatar-circle" data-user-avatar>--</div>
      <div><div class="name" data-user-name>Loading...</div><div class="email">Signed in</div></div>
    </div>
    <a class="logout-link" href="#" onclick="logout(); return false;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      Logout Session
    </a>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h2>Add New Prescription</h2>
        <p class="welcome">Fill in the details and Aura will analyze it instantly.</p>
      </div>
    </div>

    <div class="card" style="max-width:760px;">
      <form id="prescriptionForm">
        <div class="form-grid">
          <div class="field full">
            <label>Medicine Name</label>
            <input type="text" id="medicineName" required placeholder="e.g. Lisinopril">
          </div>
          <div class="field">
            <label>Dosage</label>
            <input type="text" id="dosage" required placeholder="e.g. 10mg (1 tablet)">
          </div>
          <div class="field">
            <label>Frequency</label>
            <select id="frequency" required style="width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid var(--border);">
              <option value="">Select frequency</option>
              <option value="Once daily">Once daily</option>
              <option value="Twice daily">Twice daily</option>
              <option value="Three times daily">Three times daily</option>
              <option value="As needed">As needed</option>
              <option value="Weekly">Weekly</option>
            </select>
          </div>
          <div class="field">
            <label>Start Date</label>
            <input type="date" id="startDate" required>
          </div>
          <div class="field">
            <label>End Date (optional)</label>
            <input type="date" id="endDate">
          </div>
          <div class="field full">
            <label>Reminder Times</label>
            <div class="times-box" id="timesBox"></div>
            <div class="add-time-row">
              <input type="time" id="newTime">
              <button type="button" onclick="addTime()">+ Add Time</button>
            </div>
          </div>
          <div class="field full">
            <label>Notes (optional)</label>
            <input type="text" id="notes" placeholder="e.g. Take after food">
          </div>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn" style="max-width:260px; margin-top:10px;">✨ Save & Analyze with AI</button>
      </form>

      <div id="aiSummaryContainer"></div>
    </div>
  </main>
</div>

<script src="../js/common.js"></script>
<script src="../js/add_prescription.js"></script>
</body>
</html>
